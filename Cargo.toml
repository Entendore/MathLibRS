[package]
name = "math_rs"
version = "0.3.0"
edition = "2021"
description = "A complete, high-performance math library for Rust"
license = "MIT OR Apache-2.0"

[features]
default = ["std"]
std = []
serde = ["dep:serde"]
bytemuck = ["dep:bytemuck"]
mint = ["dep:mint"]
rand = ["dep:rand"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
bytemuck = { version = "1.14", features = ["derive"], optional = true }
mint = { version = "0.5.9", optional = true }
rand = { version = "0.8", optional = true }
wide = "0.7"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"

[[bench]]
name = "mat4_mul"
harness = false

[lib]
name = "math_rs"
